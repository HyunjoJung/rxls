name: render-browser

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/render-browser.yml"
      - "bindings/render-wasm/**"
      - "examples/author_report.rs"
      - "render/**"
      - "src/**"
      - "viewer/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/check_render_browser_release_evidence.py"
      - "scripts/check_render_oracle_release_evidence.py"
      - "scripts/check_workflow_policy.py"
      - "scripts/render-parity-baseline-full.json"
      - "scripts/test_check_render_browser_release_evidence.py"
      - "scripts/test_workflow_policy.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  RENDER_MSRV: "1.85.0"
  WASM_BINDGEN_BUILD_RUST: "1.88.0"
  WASM_BINDGEN_VERSION: "0.2.126"
  NODE_VERSION: "24.18.0"
  NPM_VERSION: "11.16.0"
  CHROMIUM_VERSION: "150.0.7871.115"
  CHROMIUM_ARCHIVE_SHA256: "1be2db033133c5e2dd1a4e8664bf67b19a61bcf6ed28d2b00f433b3f0b4f9585"
  CHROMIUM_ARCHIVE_SIZE: "187332810"
  RUSTFLAGS: "-D warnings"

jobs:
  worker-wasm:
    name: bounded worker in pinned Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master (2026-07-15)
        with:
          toolchain: ${{ env.RENDER_MSRV }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: bindings/render-wasm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enforce hosted workflow policy
        run: |
          python3 scripts/check_workflow_policy.py
          python3 scripts/test_check_render_browser_release_evidence.py
      - name: Verify publishable package and pinned toolchain metadata
        working-directory: bindings/render-wasm
        run: |
          test "$(node --version)" = "v$NODE_VERSION"
          test "$(npm --version)" = "$NPM_VERSION"
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("package.json")); const l=JSON.parse(fs.readFileSync("toolchain-lock.json")); const a=l.chromium.archive; if (p.private === true || p.publishConfig?.access !== "public" || p.publishConfig?.provenance !== true || l.rust !== process.env.RENDER_MSRV || l.wasmBindgen.buildRust !== process.env.WASM_BINDGEN_BUILD_RUST || l.wasmBindgen.version !== process.env.WASM_BINDGEN_VERSION || l.chromium.version !== process.env.CHROMIUM_VERSION || a.platform !== "linux64" || a.file !== "chrome-linux64.zip" || a.sha256 !== process.env.CHROMIUM_ARCHIVE_SHA256 || String(a.sizeBytes) !== process.env.CHROMIUM_ARCHIVE_SIZE) process.exit(1)'
          cargo fmt -- --check
      - name: Test native facade and JavaScript protocol
        working-directory: bindings/render-wasm
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          npm test
      - name: Test public viewer application logic
        run: |
          npm ci --prefix viewer --ignore-scripts
          npm --prefix viewer test
      - name: Install exact wasm-bindgen CLI
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP"
          tool_root="$RUNNER_TEMP/rxls-wasm-bindgen-cli-$WASM_BINDGEN_VERSION"
          rm -rf "$tool_root"
          mkdir -p "$tool_root"
          rustup toolchain install "$WASM_BINDGEN_BUILD_RUST" --profile minimal
          cargo "+$WASM_BINDGEN_BUILD_RUST" install \
            wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked \
            --root "$tool_root"
          test "$("$tool_root/bin/wasm-bindgen" --version)" = \
            "wasm-bindgen $WASM_BINDGEN_VERSION"
          echo "$tool_root/bin" >> "$GITHUB_PATH"
      - name: Build exact wasm32 package
        working-directory: bindings/render-wasm
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/rxls-wasm-bindgen-cli-$WASM_BINDGEN_VERSION/bin:$PATH"
          test "$(command -v wasm-bindgen)" = \
            "$RUNNER_TEMP/rxls-wasm-bindgen-cli-$WASM_BINDGEN_VERSION/bin/wasm-bindgen"
          npm run build:wasm
      - name: Build public viewer at its deployed base path
        shell: bash
        env:
          RXLS_BASE_PATH: /rxls/
        run: |
          set -euo pipefail
          cargo run --locked --example author_report -- "$RUNNER_TEMP/operations-report.xlsx"
          cmp --silent viewer/samples/operations-report.xlsx "$RUNNER_TEMP/operations-report.xlsx"
          npm --prefix viewer run prepare:runtime
          npm --prefix viewer run build
      - name: Install exact Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/render-chrome target/render-browser-evidence
          curl --fail --location --retry 3 \
            --output target/render-chrome/chrome.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROMIUM_VERSION}/linux64/chrome-linux64.zip"
          test "$(stat --format=%s target/render-chrome/chrome.zip)" = "$CHROMIUM_ARCHIVE_SIZE"
          printf '%s  %s\n' "$CHROMIUM_ARCHIVE_SHA256" target/render-chrome/chrome.zip \
            | sha256sum --check --strict
          unzip -q target/render-chrome/chrome.zip -d target/render-chrome
          chrome_root=target/render-chrome/chrome-linux64
          chmod +x "$chrome_root/chrome"
          test -f "$chrome_root/chrome_sandbox"
          sudo chown root:root "$chrome_root/chrome_sandbox"
          sudo chmod 4755 "$chrome_root/chrome_sandbox"
          test "$(stat --format=%u "$chrome_root/chrome_sandbox")" = "0"
          test "$(stat --format=%a "$chrome_root/chrome_sandbox")" = "4755"
          ldd "$chrome_root/chrome" | tee "$RUNNER_TEMP/rxls-chromium-ldd.txt"
          if grep -Fq "not found" "$RUNNER_TEMP/rxls-chromium-ldd.txt"; then
            exit 1
          fi
          printf '%s\n' "PASS pinned Chromium runtime closure resolved" \
            > target/render-browser-evidence/chromium-runtime.txt
          echo "RXLS_CHROMIUM_BIN=$GITHUB_WORKSPACE/target/render-chrome/chrome-linux64/chrome" >> "$GITHUB_ENV"
          echo "CHROME_DEVEL_SANDBOX=$GITHUB_WORKSPACE/target/render-chrome/chrome-linux64/chrome_sandbox" >> "$GITHUB_ENV"
      - name: Exercise worker under strict CSP in pinned Chromium
        working-directory: bindings/render-wasm
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../target/render-browser-evidence
          npm run test:browser 2>&1 | tee ../../target/render-browser-evidence/chromium.log
      - name: Exercise public viewer in pinned Chromium
        shell: bash
        env:
          RXLS_CHROMIUM_EXECUTABLE: ${{ env.RXLS_CHROMIUM_BIN }}
        run: |
          set -euo pipefail
          npm --prefix viewer run test:browser
      - name: Pack and consume the publishable artifact
        working-directory: bindings/render-wasm
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          archive="$GITHUB_WORKSPACE/target/render-browser-evidence/rxls-render-worker-$version.tgz"
          npm pack --json --pack-destination ../../target/render-browser-evidence | tee ../../target/render-browser-evidence/npm-pack.json
          python3 "$GITHUB_WORKSPACE/scripts/check_render_package.py" . \
            --archive "$archive" \
            --npm-pack ../../target/render-browser-evidence/npm-pack.json \
            --git-rev "$(git rev-parse HEAD)" \
            --write-report ../../target/render-browser-evidence/package-report.json
          mkdir -p ../../target/render-browser-consumer
          cd ../../target/render-browser-consumer
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund \
            "$archive"
          node --input-type=module -e 'const root=await import("@rxls/render-worker"); const protocol=await import("@rxls/render-worker/protocol"); const workerUrl=root.getRenderWorkerUrl?.(); if (typeof root.RenderWorkerClient !== "function" || !(workerUrl instanceof URL) || !workerUrl.pathname.endsWith("/node_modules/@rxls/render-worker/js/worker.mjs") || protocol.PROTOCOL !== "rxls.render-worker.v1") process.exit(1)'
          RXLS_RENDER_INSTALLED_PACKAGE_ROOT="$PWD/node_modules/@rxls/render-worker" \
            node --experimental-websocket \
            "$GITHUB_WORKSPACE/bindings/render-wasm/tests/browser/run.mjs" \
            2>&1 | tee ../render-browser-evidence/installed-package-chromium.log
          sha256sum "$archive" > ../render-browser-evidence/npm-pack.sha256
      - name: Verify evidence source remained exact and clean
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Build path-neutral exact-SHA browser evidence
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          version="$(node -p 'require("./bindings/render-wasm/package.json").version')"
          python3 scripts/check_render_browser_release_evidence.py build \
            --source-log target/render-browser-evidence/chromium.log \
            --installed-log target/render-browser-evidence/installed-package-chromium.log \
            --runtime-evidence target/render-browser-evidence/chromium-runtime.txt \
            --npm-pack target/render-browser-evidence/npm-pack.json \
            --npm-archive "target/render-browser-evidence/rxls-render-worker-${version}.tgz" \
            --head-sha "$EXPECTED_SHA" \
            --platform linux \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output target/render-browser-evidence/browser-summary.json
          python3 scripts/check_render_browser_release_evidence.py verify \
            --summary target/render-browser-evidence/browser-summary.json \
            --head-sha "$EXPECTED_SHA" \
            --platform linux \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Upload browser-rendering evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-browser-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/render-browser-evidence/browser-summary.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
