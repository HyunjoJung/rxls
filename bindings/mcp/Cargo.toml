[package]
name = "rxls-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Local Model Context Protocol server for the rxls spreadsheet toolkit"
repository = "https://github.com/HyunjoJung/rxls"
homepage = "https://hyunjojung.github.io/rxls/"
readme = "README.md"
authors = ["Hyunjo Jung <j96263732@gmail.com>"]
keywords = ["mcp", "xls", "xlsx", "spreadsheet", "excel"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
rmcp = { version = "3.1.4", default-features = false, features = ["macros", "server", "transport-io"] }
rxls = { version = "0.1.3", path = "../..", default-features = false, features = ["full"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
rmcp = { version = "3.1.4", default-features = false, features = ["client", "macros", "server", "transport-io"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = "warn"
