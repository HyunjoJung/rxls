[package]
name = "rxls-wasm"
version = "0.1.4"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "WebAssembly bindings for the rxls spreadsheet library"
repository = "https://github.com/HyunjoJung/rxls"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.103"
rxls = { version = "0.1.4", path = "../..", default-features = false, features = ["full"] }
wasm-bindgen = "0.2.126"

# Keep the portable Node/browser adapter within its existing 2 MiB ceiling.
# This separate Cargo root leaves native and render-worker profiles unchanged.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
